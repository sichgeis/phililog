# Local development only. Production setup is documented in docs/setup.md.
project_id = "phililog"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

# Keep the email provider enabled; auth.enable_signup above blocks registration.
[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false
